<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="CastTV: cast videos from your Android phone to your TV.">
<title>CastTV</title>
<style>
:root {
  --brand: #6d28d9;
  --brand-end: #2e1065;
  --text: #1a1426;
  --muted: #4e4561;
  --bg: #faf7ff;
  --card: #ffffff;
  --line: #e9e3f3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --brand: #c4a6ff;
    --brand-end: #1e0b4b;
    --text: #eae4f5;
    --muted: #b9afcc;
    --bg: #0f0a1a;
    --card: #1a1428;
    --line: #322a45;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
.hero {
  background: linear-gradient(135deg, #6d28d9, var(--brand-end));
  color: #ffffff;
  border-radius: 24px;
  padding: 32px 24px;
}
h1 { margin: 0 0 8px; font-size: 40px; font-weight: 800; letter-spacing: -0.5px; }
h1 span { color: #ede4ff; }
.hero p { margin: 0; font-size: 19px; color: #ede4ff; }
ul { list-style: none; padding: 0; margin: 24px 0 0; }
li { margin: 12px 0; }
a.link {
  display: block;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px 20px;
  color: var(--brand);
  font-weight: 700;
  text-decoration: none;
}
footer { color: var(--muted); font-size: 15px; margin-top: 32px; }
footer a { color: var(--brand); }
</style>
</head>
<body>
<main>
<div class="hero">
<h1>Cast<span>TV</span></h1>
<p>CastTV sends the videos on your Android phone, and video links, to your TV on the same Wi-Fi, with Google Cast and DLNA.</p>
</div>
<ul>
<li><a class="link" href="privacy-policy.html">Privacy Policy</a></li>
<li><a class="link" href="terms.html">Terms of Use</a></li>
</ul>
<footer>© 2026 Marouane Studio, Morocco · <a href="mailto:tvcastsupport@gmail.com">tvcastsupport@gmail.com</a></footer>
</main>
</body>
</html>
